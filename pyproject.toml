[project]
name = "birthday-provider-development"
version = "0.0.0"
description = "Development tooling for the Birthday Provider Home Assistant custom integration"
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
