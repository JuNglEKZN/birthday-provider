name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install tooling
        run: python -m pip install --upgrade pip pytest ruff
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: python -m pytest
