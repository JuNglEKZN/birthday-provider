name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install tooling
        run: >-
          python -m pip install --upgrade pip
          pytest pytest-asyncio pytest-homeassistant-custom-component ruff
          "homeassistant>=2026.8.0"
      - name: Ruff
        run: ruff check .
      - name: Core tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest
          tests/test_core_duplicates.py
          tests/test_core_models.py
          tests/test_core_occurrence.py
          tests/test_core_parsing.py
      - name: CardDAV provider tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest
          -p pytest_asyncio.plugin
          -o asyncio_mode=auto
          tests/test_icloud_carddav.py
      - name: Home Assistant tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest
          -c pytest-ha.ini
          -p pytest_asyncio.plugin
          -p pytest_homeassistant_custom_component.plugins
          tests/test_ha_storage.py
          tests/test_ha_integration.py
